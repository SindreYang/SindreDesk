name: Server CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel obsolete duplicate client runs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            gh run list --repo "$GH_REPO" --branch "$PR_BRANCH" --status "$status" --limit 100 --json databaseId,workflowName --jq '.[] | select(.workflowName == "Android ARM64 client build" or .workflowName == "Linux x64 Host and Client build" or .workflowName == "Windows x64 Host and Client build" or .workflowName == "Client source integration") | .databaseId' |
              while IFS= read -r run_id; do
                [ -n "$run_id" ] || continue
                gh run cancel "$run_id" --repo "$GH_REPO" || true
              done
          done
  test:
    needs: cancel-obsolete
    name: Unit tests, static checks and Linux x64 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Run race-enabled tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Build Linux x64 server
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server .
      - name: Check build scripts
        run: |
          bash -n ../scripts/checkout-upstream.sh
          bash -n ../scripts/build-server.sh
      - name: Verify missing embedded binaries fail safely
        env:
          SINDREDESK_DATA_DIR: ${{ runner.temp }}/sindredesk-test
        run: |
          if ./server; then
            echo "Missing embedded binaries should fail"
            exit 1
          fi
  integration:
    name: Linux x64 server integration
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Build release server
        run: bash scripts/build-server-release.sh
      - name: Run server integration tests
        run: bash scripts/test-server-integration.sh

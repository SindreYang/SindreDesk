name: Server integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - run: bash scripts/build-server-release.sh
      - run: bash scripts/test-server-integration.sh
      - name: Prepare server CI artifact
        run: |
          test -s dist/SindreDeskServer
          cd dist
          sha256sum SindreDeskServer > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SindreDeskServer-linux-x64-ci
          path: |
            dist/SindreDeskServer
            dist/SHA256SUMS
          if-no-files-found: error

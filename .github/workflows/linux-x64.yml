name: Linux x64 Host and Client build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        role: [host, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc git g++ libpam0g-dev \
            libasound2-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
            libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm wget \
            libayatana-appindicator3-dev libssl-dev pkg-config
      - name: Prepare patched upstream source
        run: python scripts/prepare-client.py ${{ matrix.role }}
      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Apply upstream Flutter compatibility patch
        working-directory: upstream/${{ matrix.role }}
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/upstream/${{ matrix.role }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            upstream/${{ matrix.role }} -> target
          key: linux-x64-${{ matrix.role }}
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false
      - name: Install vcpkg dependencies
        working-directory: upstream/${{ matrix.role }}
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate Flutter Rust bridge and resolve Dart packages
        working-directory: upstream/${{ matrix.role }}
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          cd flutter
          flutter pub get
          cd ..
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - name: Build Linux x64 application
        working-directory: upstream/${{ matrix.role }}
        run: |
          python3 build.py --flutter --hwcodec --unix-file-copy-paste
          bundle="flutter/build/linux/x64/release/bundle"
          test -x "$bundle/sindredesk-${{ matrix.role }}"
          test -s "$bundle/lib/librustdesk.so"
          test -d "$bundle/data/flutter_assets"
          tar -czf "$GITHUB_WORKSPACE/SindreDesk-${{ matrix.role }}-linux-x64.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SindreDesk-${{ matrix.role }}-linux-x64
          path: SindreDesk-${{ matrix.role }}-linux-x64.tar.gz
          if-no-files-found: error

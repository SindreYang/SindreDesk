name: Windows x64 Host and Client build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        role: [host, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare patched upstream source
        run: python scripts/prepare-client.py ${{ matrix.role }}
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: 15.0.6
      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
          architecture: x64
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            upstream/${{ matrix.role }} -> target
          key: windows-x64-${{ matrix.role }}
      - name: Install custom RustDesk Flutter engine
        shell: pwsh
        run: |
          $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}"
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = Join-Path $flutterRoot "bin/cache/artifacts/engine/windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDir | Out-Null
          Copy-Item -Path "windows-x64-release/*" -Destination $engineDir -Recurse -Force
      - name: Apply upstream Flutter compatibility patch
        shell: pwsh
        run: |
          $flutterRoot = "${{ steps.flutter.outputs.CACHE-PATH }}"
          $patch = "$env:GITHUB_WORKSPACE/upstream/${{ matrix.role }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          git -C $flutterRoot apply $patch
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false
      - name: Install vcpkg dependencies
        working-directory: upstream/${{ matrix.role }}
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Generate Flutter Rust bridge and resolve Dart packages
        working-directory: upstream/${{ matrix.role }}
        shell: pwsh
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          Push-Location flutter
          flutter pub get
          Pop-Location
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          Copy-Item ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h -Force
      - name: Build Windows x64 application
        working-directory: upstream/${{ matrix.role }}
        shell: pwsh
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          VCPKGRS_TRIPLET: x64-windows-static
        run: |
          python build.py --flutter --hwcodec
          $bundle = "flutter/build/windows/x64/runner/Release"
          $appName = if ("${{ matrix.role }}" -eq "host") { "SindreDeskHost" } else { "SindreDeskClient" }
          if (!(Test-Path "$bundle/$appName.exe")) {
            throw "SindreDesk executable missing from build output"
          }
          if (!(Test-Path "$bundle/librustdesk.dll")) {
            throw "RustDesk FFI library missing from build output"
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath "$env:GITHUB_WORKSPACE/SindreDesk-${{ matrix.role }}-windows-x64.zip" -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SindreDesk-${{ matrix.role }}-windows-x64
          path: SindreDesk-${{ matrix.role }}-windows-x64.zip
          if-no-files-found: error

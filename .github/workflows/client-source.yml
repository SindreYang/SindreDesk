name: Client source integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [host, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Prepare patched upstream source
        run: python scripts/prepare-client.py ${{ matrix.role }}
      - name: Resolve Flutter dependencies
        working-directory: upstream/${{ matrix.role }}/flutter
        run: flutter pub get
      - name: Analyze SindreDesk entry page
        working-directory: upstream/${{ matrix.role }}/flutter
        run: flutter analyze --no-pub lib/sindre/sindre_home.dart
      - name: Check patched Rust syntax
        working-directory: upstream/${{ matrix.role }}
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt
          rustup run 1.75.0 rustfmt --edition 2021 --emit stdout --config skip_children=true src/client.rs src/common.rs src/server.rs src/rendezvous_mediator.rs libs/hbb_common/src/config.rs > /dev/null

name: Android ARM64 client build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        role: [host, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpam0g-dev libpulse-dev libva-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
            llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget
      - name: Prepare patched upstream source
        run: python scripts/prepare-client.py ${{ matrix.role }}
      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: '3.24.5'
      - name: Apply upstream Flutter compatibility patch
        working-directory: upstream/${{ matrix.role }}
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/upstream/${{ matrix.role }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.75.0
          targets: aarch64-linux-android
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            upstream/${{ matrix.role }} -> target
          key: android-arm64-${{ matrix.role }}
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false
      - name: Build Android native dependencies
        working-directory: upstream/${{ matrix.role }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./flutter/build_android_deps.sh arm64-v8a
      - name: Generate Flutter Rust bridge and resolve Dart packages
        working-directory: upstream/${{ matrix.role }}
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          cd flutter
          flutter pub get
          cd ..
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
      - name: Build Rust ARM64 library
        working-directory: upstream/${{ matrix.role }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --version 3.1.2 --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build APK
        working-directory: upstream/${{ matrix.role }}
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' ./flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' ./flutter/android/app/build.gradle
          cd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep 'lib/arm64-v8a/liblibrustdesk.so'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SindreDesk-${{ matrix.role }}-android-arm64
          path: upstream/${{ matrix.role }}/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

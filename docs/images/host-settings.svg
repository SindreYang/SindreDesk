<svg xmlns="http://www.w3.org/2000/svg" width="420" height="480" viewBox="0 0 420 480" role="img" aria-label="客户端设置界面示意图"><title>客户端设置 — 界面示意图</title><g font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif"><rect x="0.5" y="0.5" width="419" height="479" rx="9" fill="#dce0e6" stroke="#cbd1d9"/><rect x="1" y="1" width="418" height="31" rx="8" fill="white" stroke="none"/><text x="12" y="21" font-size="12" fill="#20242c" font-weight="400" text-anchor="start">被控端</text><rect x="20" y="48" width="380" height="408" rx="24" fill="#fff" stroke="none"/><text x="44" y="83" font-size="22" fill="#20242c" font-weight="500" text-anchor="start">设置</text><text x="210" y="113" font-size="14" fill="#20242c" font-weight="400" text-anchor="middle">服务器配置（跨网络连接）</text><text x="44" y="148" font-size="14" fill="#667085" font-weight="400" text-anchor="start">服务器 IP / 域名</text><path d="M44 159H376" fill="none" stroke="#d9dde4"/><text x="44" y="188" font-size="14" fill="#667085" font-weight="400" text-anchor="start">服务器公钥</text><path d="M44 200H376" fill="none" stroke="#d9dde4"/><path d="M44 218H376" fill="none" stroke="#d9dde4"/><text x="44" y="248" font-size="14" fill="#20242c" font-weight="500" text-anchor="start">局域网兼容模式</text><text x="44" y="268" font-size="12" fill="#667085" font-weight="400" text-anchor="start">测试用：加密握手失败后允许</text><text x="44" y="285" font-size="12" fill="#667085" font-weight="400" text-anchor="start">非加密直连，两端均需开启</text><rect x="331" y="241" width="44" height="24" rx="12" fill="#e4e8ed" stroke="#828b98"/><circle cx="343" cy="253" r="9" fill="#828b98"/><path d="M44 302H376" fill="none" stroke="#d9dde4"/><text x="44" y="332" font-size="14" fill="#20242c" font-weight="500" text-anchor="start">系统级开机自启</text><text x="44" y="352" font-size="12" fill="#667085" font-weight="400" text-anchor="start">需要管理员授权；系统服务在登录前启动</text><rect x="331" y="324" width="44" height="24" rx="12" fill="#e4e8ed" stroke="#828b98"/><circle cx="343" cy="336" r="9" fill="#828b98"/><text x="44" y="423" font-size="10" fill="#667085" font-weight="400" text-anchor="start">基于SindreDesk研发</text><text x="266" y="423" font-size="14" fill="#1769d2" font-weight="500" text-anchor="middle">取消</text><rect x="300" y="399" width="76" height="38" rx="19" fill="#1769d2" stroke="none"/><text x="338" y="423" font-size="14" fill="white" font-weight="500" text-anchor="middle">保存</text></g></svg>
